<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirie Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      background: #16213e;
      padding: 12px 20px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #header h1 { font-size: 18px; color: #e94560; }
    #status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      background: #333;
    }
    #status.connected { background: #1b5e20; color: #a5d6a7; }
    #status.disconnected { background: #b71c1c; color: #ef9a9a; }
    #canvas-root {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    #state-view {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }
    #actions {
      padding: 12px 20px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 8px;
    }
    #actions input {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    #actions button {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #actions button:hover { background: #c73e54; }
    @media (prefers-color-scheme: light) {
      body { background: #f5f5f5; color: #333; }
      #header { background: #fff; border-bottom-color: #ddd; }
      #canvas-root { background: #f5f5f5; }
      #state-view { background: #fff; }
      #actions { background: #fff; border-top-color: #ddd; }
      #actions input { background: #f5f5f5; border-color: #ddd; color: #333; }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Kirie Canvas</h1>
    <span id="status" class="disconnected">Disconnected</span>
  </div>
  <div id="canvas-root">
    <div id="state-view">Waiting for data...</div>
  </div>
  <div id="actions">
    <input type="text" id="action-input" placeholder="Send action to agent..." />
    <button id="action-btn">Send</button>
  </div>
  <script src="canvas.js"></script>
</body>
</html>
