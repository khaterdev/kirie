agent:
  maxTurns: 100                    # 0 = unlimited
  model: "claude-opus-5-5[1m]"
  # customInstructions: "Always respond in English. My name is Alex."
  # workspace: "/path/to/your/projects"

  # How messages are executed.
  #   v1           — one query() per message. The subprocess starts, answers,
  #                  and exits, so every message pays full startup cost.
  #   v2 (default) — one persistent session per conversation, held open with
  #                  streaming input. Skips per-message startup, but keeps
  #                  subprocesses alive until idle timeout or eviction.
  # sessionMode: "v2"
  # sessionIdleTimeoutMs: 600000   # v2 only: close a session after 10 min idle
  # maxSessions: 20                # v2 only: live sessions before evicting oldest idle
  # strictMcpConfig: false         # true: load only Kirie's MCP servers (no user-scope servers or claude.ai connectors)
  # fallback:                      # Retry a failed turn on another model (off by default)
  #   enabled: false
  #   models: []                   # e.g. ["claude-sonnet-5-5", "claude-haiku-5-5"], at most 4
  #   sdkNative: true
  #   cooldownMinutes: 30
  #   maxAttemptsPerTurn: 4
  #   notify: true

security:
  owner:
    identities:
      telegram: []                 # Numeric user IDs
      discord: []                  # Discord user IDs
      whatsapp: []                 # Phone numbers
      signal: []                   # Phone numbers
      slack: []                    # Slack user IDs (U01ABC...)
  dmPolicy: "owner-only"          # "owner-only", "allowlist", "open"
  groupPolicy: "mention-only"     # "mention-only", "all", "disabled"
  rateLimit:
    perUser:
      maxRequests: 30
      windowMs: 60000
    perGroup:
      maxRequests: 60
      windowMs: 60000
  # scrubbing:                    # Secret scrubbing. On by default; read once at start
  #   enabled: true               # there is no command to turn it off at runtime
  #   sinks:                      # channels, logs, memory, chatHistory, taskResults, heartbeatLogs,
  #     toolOutputToModel: false  # http, webhookPayloads, pluginEvents: all true by default
  #   knownSecrets:               # exact values registered from these sources
  #     credentialStore: true
  #     config: true
  #     env: true
  #     secretsDir: true          # ~/.kirie/secrets/*.env
  #     minLength: 12
  #   disabledRules: []           # e.g. ["secret-assignment"]
  #   # Patterns must be bounded: every quantifier {n} or {n,m} with m <= 256, no * or +,
  #   # no {n,}, no quantified groups, at most one variable-length quantifier, no
  #   # backreferences; custom patterns start with 2+ literal characters.
  #   customPatterns: []          # e.g. [{ name: "acme", pattern: "acme_[a-z0-9]{32}" }]
  #   allowPatterns: []
  #   mask: "label"               # "label" or "partial"

channels:
  telegram:
    enabled: false
    token: "$credential:telegram.bot_token"
    # webhookUrl: "https://example.com/webhooks/telegram"  # Use webhook instead of polling
    # pollingTimeout: 30           # Long-polling timeout in seconds
    # apiRoot: "http://127.0.0.1:8081"  # Self-hosted telegram-bot-api (2 GB files). See docs/telegram-local-bot-api.md
    # allowedUserIds: [123456789]  # Only allow these user IDs (empty = global policy)
    # allowGroups: true            # Whether bot responds in group chats
    # allowAddToGroups: true       # Whether bot can be added to new groups
  discord:
    enabled: false
    token: "$credential:discord.bot_token"
    # intents: []                  # Additional Discord gateway intents
    # allowedUserIds: []
    # allowGroups: true
  slack:
    enabled: false
    botToken: "$credential:slack.bot_token"
    appToken: "$credential:slack.app_token"
    # signingSecret: "$credential:slack.signing_secret"
    # allowedUserIds: []
  whatsapp:
    enabled: false
    # sessionDataPath: "~/.kirie/whatsapp-auth"  # Auth session storage
  signal:
    enabled: false
    apiUrl: "http://localhost:8080"
    # phoneNumber: "+1234567890"   # Registered Signal phone number

  # Self-healing for channels that drop offline. Adapters make exactly one
  # connection attempt, so without this a transient DNS failure at boot leaves
  # a channel dead until someone restarts it by hand.
  health:
    enabled: true
    # checkIntervalMs: 15000       # How often to poll channel status
    # maxRecoveryAttempts: 0       # Restart attempts before giving up (0 = never give up)
    # baseBackoffMs: 1000          # Delay before the first restart attempt
    # maxBackoffMs: 60000          # Ceiling on the delay between attempts

memory:
  enabled: true
  backend: "sqlite"
  # dbPath: "~/.kirie/memory.db"   # Custom database path
  embeddings:
    provider: "local"              # "local" (offline ONNX), "openai" (API), "noop" (disable)
    # apiKey: "$credential:openai.api_key"        # Only needed for openai provider
    # model: "fast-bge-small-en-v1.5"             # Local default; for openai: "text-embedding-3-small"

gateway:
  port: 18789
  bind: "loopback"                # "loopback" (localhost only) or "all" (remote access)
  # bearerToken: "$credential:gateway.bearer_token"  # Required when bind is "all"
  # extraAllowedHosts: []         # Host headers accepted besides 127.0.0.1/localhost/[::1]:<port>

browser:
  enabled: false                  # Playwright-based browser automation (auto-installs Chromium)

proactive:
  enabled: true
  tier2IntervalMinutes: 15        # Minutes between triage LLM checks
  tier2Model: "claude-haiku-4-5"  # Fast/cheap model for triage
  tier3Model: "claude-opus-5-5[1m]"   # Deep reasoning model for escalation
  activeHours:
    start: "00:00"
    end: "23:59"
    timezone: "UTC"               # IANA timezone (e.g. "America/New_York", "Europe/London")
  dailyDigestTime: "09:00"        # HH:MM in 24h format
  notificationCooldownMinutes: 60 # Suppress repeat notifications for same signal type
  heartbeatFile: "~/.kirie/HEARTBEAT.md"  # Checklist the triage LLM evaluates
  # maxChecklistBytes: 8192       # Largest checklist the triage reads
  heartbeatLogging:
    enabled: true
    levels:                       # Minimum log level per tier
      tier1: "info"               # Signal detection
      tier2: "info"               # Triage decisions
      tier3: "debug"              # Escalation tasks
      heartbeat: "info"           # Retry, schedule, cleanup
    retention:                    # Days to keep logs (0 = forever)
      tier1: 7
      tier2: 30
      tier3: 0
      heartbeat: 14

